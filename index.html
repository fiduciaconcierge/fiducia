<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== '/') {
          sessionStorage.removeItem('redirect');
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>FIDUCIA | Global Private Concierge</title>

    <!-- SEO -->
    <meta name="description" content="FIDUCIA is a Global Private Concierge serving elite clientele worldwide with exclusive lifestyle management services." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fiduciagroup.in/" />

    <!-- Open Graph -->
    <meta property="og:title" content="FIDUCIA | Global Private Concierge" />
    <meta property="og:description" content="FIDUCIA is a Global Private Concierge serving elite clientele worldwide with exclusive lifestyle management services." />
    <meta property="og:url" content="https://fiduciagroup.in/" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html { scroll-behavior: smooth; scroll-padding-top: 0; }
      body { background-color: #050505; color: #e5e5e5; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
      h1,h2,h3,h4,h5,h6,.font-serif { font-family: 'Cormorant Garamond', serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0a0a0a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
      * { scrollbar-width: thin; scrollbar-color: #333 #0a0a0a; }
      .luxury-filter { filter: grayscale(100%) contrast(110%) brightness(80%); transition: filter 0.7s ease; }
      .luxury-filter:hover { filter: grayscale(0%) contrast(100%) brightness(100%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
